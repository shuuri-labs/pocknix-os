# pocknix-os — plymouth boot splash config.
# pocknix = the stock spinner with the Pocknix wordmark in place of the Arch watermark,
# shipped by pocknix-branding in its OWN theme dir so a plymouth upgrade can't undo it.
# ShowDelay=0: with no initramfs the splash already starts "late"
# (sysinit, ~2.5s); don't add the default 5s hide-short-boots delay on top or it would never show.
# DeviceTimeout caps how long plymouthd waits for the DRM device before falling back, so a display
# problem can't wedge boot.
[Daemon]
Theme=pocknix
ShowDelay=0
DeviceTimeout=8
DeviceScale=2
