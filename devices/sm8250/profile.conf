# POSIX sh, sourced by scripts/lib.sh after config/pocknix.conf; the environment overrides it.

DEVICE_PRETTY="SM8250 family (Retroid Pocket 5, Flip 2)"
DEVICE_HOSTNAME="pocknix"     # kernel CONFIG_DEFAULT_HOSTNAME only; the image sets the real one
: "${SOC:=sm8250}"

# arm-efi: GRUB off the factory ABL (dev/kernel.md). GPT p1 FAT (KERNEL, EFI/, boot/grub/),
# p2 ext4 root.
: "${BOOTLOADER:=arm-efi}"
: "${SD_FAT_LABEL:=POCKNIX}"        # a ROCKNIX label would hijack ROCKNIX boots
: "${SD_BOOT_PARTNAME:=system}"
: "${ROOT_LABEL:=POCKNIX_ROOT}"

# The runtime copy is grub.cfg's "linux /KERNEL" line; build-packages.sh dies on drift.
# gpt: Retroid recovery images corrupt the primary GPT, hiding the ABL partitions.
# root= by PARTUUID: an internal install carries the same label.
: "${KERNEL_CMDLINE_ROOT:=root=PARTUUID=${SD_ROOT_PARTUUID} rw}"
: "${KERNEL_CMDLINE_EXTRA:=quiet loglevel=3 systemd.show_status=false splash logo.nologo plymouth.ignore-serial-consoles rootwait console=tty0 video=efifb:off gpt}"
: "${KERNEL_CMDLINE:=${KERNEL_CMDLINE_ROOT} ${KERNEL_CMDLINE_EXTRA}}"

: "${FW_SRC_REL:=rocknix-${SOC}/filesystem/usr/lib/kernel-overlays/base/lib/firmware}"

: "${DEVICE_BSP_PKG:=pocknix-bsp-sm8250}"
: "${DEVICE_META_PKG:=pocknix-device-sm8250}"
: "${KERNEL_PKG:=linux-pocknix-${SOC}}"
