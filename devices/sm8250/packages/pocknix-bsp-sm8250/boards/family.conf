# /usr/lib/pocknix/boards/family.conf: facts every SM8250 board shares, sourced first by
# each board file (a board may override).
POCKNIX_SOC=sm8250

# CH13726A AMOLED, native 1080x1920@60 PORTRAIT, mounted rotation=270 (DTS) -> landscape. W/H stay
# NATIVE portrait: pocknix-steam transposes them for left/right and rotation autodetects.
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=60
POCKNIX_PANEL_ORIENT=left        # gamescope --force-orientation
POCKNIX_PANEL_MM=177x100         # fake: gamepadui DPI, see devices/README.md
POCKNIX_DESKTOP_ROTATE=left      # kscreen-doctor rotation token
POCKNIX_DESKTOP_SCALE=2.5        # same panel res/size class as the RP6

# Cores games and emulators are pinned to (read through pocknix-bsp-common's cores.sh):
# Snapdragon 865 = cpu0-3 A55 (little), cpu4-7 A77 (big).
POCKNIX_BIG_CORES=4-7

# Speaker sink the DSP sits in front of; a board opts in with POCKNIX_SPEAKER_PROFILE.
POCKNIX_SPEAKER_SINK=alsa_output.platform-sound.HiFi__Speaker__sink

# --- install-to-internal contract (arm-efi) -----------------------------------
# Main LUN /dev/sda: Android GPT with userdata LAST, so shrink-and-append applies; the boot chain
# (abl, boot, tz) is on /dev/sde, untouched. Boot entry, grub.cfg + fstab pin internal PARTUUIDs.
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=POCKNIX
