# AYN Thor HiFi verb. Author: Luke Johnson. Mic = the DMIC3/SWR_MIC7 route.

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	# Inline the WCD9385 and rx-macro enable sequence in CLS_AB with all four companders off:
	# the base include enables RX_COMP1/2 with HPH_COMP off in CLS_H_ULP, clipping at ~80 mV.
	EnableSequence [
		cset "name='RX_HPH PWR Mode' ULP"
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='CLSH Switch' 1"
		cset "name='LO Switch' 1"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
	]

	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	# No PlaybackMixerElem: PipeWire attenuates in software before the DAC, keeping the
	# WCD9385 and rx-macro fixed at unity (84 / 20 = 0 dB) instead of driving HPH to +6 dB.
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC7"
		cset "name='DMIC3 Switch' 1"
		cset "name='DMIC3_MIXER Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 100"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='DMIC3_MIXER Switch' 0"
		cset "name='DMIC3 Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}

SectionDevice."DisplayPort" {
	Comment "DisplayPort playback"

	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP0 Jack"
		JackHWMute "Speaker"
	}
}
