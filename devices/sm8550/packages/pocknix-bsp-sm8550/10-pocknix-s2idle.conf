# s2idle is the only safe suspend mode with the cluster-sleep kernel stack:
# the rail cuts apply on every suspend path, but the protective PCIe suspend
# OPP floor only runs on non-s2ram, so a deep entry wedges the device.
# Reset SuspendState (drop-ins append), pin mem, select s2idle within it.
[Sleep]
SuspendState=
SuspendState=mem
MemorySleepMode=s2idle
