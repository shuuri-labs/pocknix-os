# /usr/lib/pocknix/device.conf — SM8550 family runtime board DISPATCHER. POSIX sh, SOURCED
# by consumers at launch (then /etc/pocknix/device.conf as the admin override), so it must
# stay side-effect free. Unknown/absent model (includes the image-build chroot, which has no
# /proc/device-tree) falls back to rp6 and logs the model a new board entry needs.
_pocknix_model="$(cat /proc/device-tree/model 2>/dev/null | tr -d '\0')"
case "${_pocknix_model}" in
  "Retroid Pocket 6" | "Retroid Pocket 6 TOP-DPAD")
    . /usr/lib/pocknix/boards/rp6.conf
    ;;
  "AYN Odin 2")
    . /usr/lib/pocknix/boards/odin2.conf
    ;;
  "AYN Odin 2 Mini")
    . /usr/lib/pocknix/boards/odin2mini.conf
    ;;
  "AYN Odin 2 Portal")
    . /usr/lib/pocknix/boards/odin2portal.conf
    ;;
  "AYN Thor")
    . /usr/lib/pocknix/boards/thor.conf
    ;;
  *)
    # Board not in the list: consumers must not force guessed values (see pocknix-desktop-rotate).
    POCKNIX_BOARD_UNKNOWN=1
    . /usr/lib/pocknix/boards/rp6.conf
    [ -n "${_pocknix_model}" ] && \
      logger -t pocknix "device.conf: unknown DT model '${_pocknix_model}' — using rp6 board defaults" 2>/dev/null || true
    ;;
esac
unset _pocknix_model
