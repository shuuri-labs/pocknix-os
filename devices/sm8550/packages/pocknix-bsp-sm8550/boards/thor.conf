# /usr/lib/pocknix/boards/thor.conf: AYN Thor (dual screen), on top of boards/family.conf.
. /usr/lib/pocknix/boards/family.conf
POCKNIX_DEVICE=thor

# Top panel: chipone,icna3520, native 1080x1920@120 portrait, rotation=90 (Odin 2 mounting -> right).
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=120
POCKNIX_PANEL_ORIENT=right       # gamescope --force-orientation
POCKNIX_DESKTOP_ROTATE=right     # kscreen-doctor rotation token
POCKNIX_DESKTOP_SCALE=2.5

# Connector names: top = mdss_dsi1 = DSI-2, bottom = mdss_dsi0 = DSI-1. gamescope is pinned
# to the top output, kwin drives both. Touchscreen names are the DTS labels (kernel patch 0015).
POCKNIX_PANEL_OUTPUT=DSI-2
POCKNIX_PANEL2_OUTPUT=DSI-1
POCKNIX_PANEL2_W=1080
POCKNIX_PANEL2_H=1240
POCKNIX_DESKTOP2_SCALE=2.5       # ~same ppi as the top panel
POCKNIX_TOUCH_NAME=top_touchscreen
POCKNIX_TOUCH2_NAME=bottom_touchscreen

# Backlight node of the panel gamescope drives, for Steam's brightness fallback.
POCKNIX_PRIMARY_BACKLIGHT=ae96000.dsi.0
