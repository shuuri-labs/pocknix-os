# devices/sm8750/profile.conf — build-time profile: the SM8750 FAMILY image.
#
# One image per SoC, runtime board selection within it (same shape as
# devices/sm8550): the BSP (pocknix-bsp-sm8750) ships per-board device.confs
# under /usr/lib/pocknix/boards/ and picks one at boot by
# /proc/device-tree/model. Boards: AYN Odin 3, KONKR Pocket FIT Elite.
#
# POSIX sh, sourced by scripts/lib.sh right after config/pocknix.conf; override
# any value from the environment as usual.

DEVICE_PRETTY="SM8750 family (AYN Odin 3, KONKR Pocket FIT Elite)"
DEVICE_HOSTNAME="pocknix"     # substituted for @DEVICENAME@ in the kernel config (CONFIG_DEFAULT_HOSTNAME; runtime hostname is set by the image anyway)
: "${SOC:=sm8750}"            # selects kernel/${SOC}/ and vendor/rocknix-${SOC}/

# --- qcom-abl boot contract (what the ROCKNIX-flashed ABL expects) -------------
# GPT p1: FAT32, partition-name SD_BOOT_PARTNAME, FAT label SD_FAT_LABEL,
# containing KERNEL + KERNEL.md5. GPT p2: ext4, partition-name ROOT_LABEL.
: "${BOOTLOADER:=qcom-abl}"
: "${SD_FAT_LABEL:=ROCKNIX}"        # the ABL looks for this label; = ROCKNIX's DISTRO_BOOTLABEL
: "${SD_BOOT_PARTNAME:=system}"     # GPT name of the FAT boot partition (ROCKNIX uses "system")
: "${ROOT_LABEL:=POCKNIX_ROOT}"

# --- kernel command line ------------------------------------------------------
# Plain ext4 root, NO initramfs (UFS/SCSI/ext4 built-in), standard root= spec.
# One cmdline for the whole family (the boot image bakes it). EXTRA = ROCKNIX's
# SM8750 EXTRA_CMDLINE + pocknix silent boot + the SM8750 quirks.
# NOTE: `clk_ignore_unused pd_ignore_unused` were removed — they caused the
# 7.1.2 kernel to hang at boot (the 7.1.0 kernel that works does NOT use them).
# CRITICAL: `video=efifb:off` is REQUIRED on the Odin 3 (SM8750). Without it the
# kernel activates the EFI framebuffer, which conflicts with the Qualcomm DRM/DSI
# panel driver and leaves the screen black at the AYN logo. ROCKNIX and Batocera
# both include it. The rest of the params mirror ROCKNIX's SM8750 EXTRA_CMDLINE.
#
# 2026-08-31: Changed root spec to use the same labels ROCKNIX uses on its boot
# SD (`boot=LABEL=ROCKNIX disk=LABEL=STORAGE`). Our SD already has those exact
# labels (we copied the partition layout from ROCKNIX), so the kernel can mount
# the rootfs without renaming partitions. The previous `root=PARTLABEL=POCKNIX_ROOT`
# made the kernel boot but then hang because it couldn't find the partition by
# that label on the SD (only `STORAGE` exists there), so init never ran.
#
# 2026-09-01: Added earlyprintk + console=ttyMSM0 to dump kernel logs via USB
# serial so we can see what's hanging at boot when the panel goes black.
#
# 2026-09-01 (evening): Switched to pstore-based log capture for headless boot
# diagnosis. `pstore.backend=ramoops` reserves a RAM ringbuffer for kernel panic
# logs; `ramoops.record=1 memmap=4M` keeps the buffer large enough for our kernel
# logs. `pstore` mounts at /sys/fs/pstore and survives reboot into rootfs.
# The systemd `pstore` service (or manual cp at early-boot) saves the content
# to /var/log/pstore/, which we can read back from the SD even if the kernel
# never finishes booting (panel-chipone ID -110, etc.).
#
# 2026-09-01 (late evening): Added `oops=panic panic=5` (last `panic=` wins) so
# the kernel logs the oops into pstore and continues booting instead of
# freezing, letting systemd-pstore.service dump the log to /var/lib/systemd/pstore
# where we can read it from the SD. We also keep `quiet` minimal logs and force
# `loglevel=7` to capture as much detail as possible.
# 2026-09-11: Added `mem_sleep_default=s2idle`. s2idle is the only safe suspend mode
# on the SM8750 (deep wedges it), and without this the kernel defaults mem_sleep to
# `deep`. ROCKNIX pins s2idle the same way. Kept in the cmdline (device-specific) so
# SM8250/SM8550 are unaffected.
: "${KERNEL_CMDLINE_ROOT:=root=PARTLABEL=POCKNIX_ROOT rootwait}"
: "${KERNEL_CMDLINE_EXTRA:=quiet loglevel=3 systemd.show_status=false splash plymouth.ignore-serial-consoles rootwait console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat irqaffinity=0-1 cgroup.memory=nokmem,nosocket nosoftlockup mem_sleep_default=s2idle}"
: "${KERNEL_CMDLINE:=${KERNEL_CMDLINE_ROOT} ${KERNEL_CMDLINE_EXTRA}}"

# --- firmware source (within vendor/, populated by `make sync`) ---------------
: "${FW_SRC_REL:=rocknix-${SOC}/filesystem/usr/lib/kernel-overlays/base/lib/firmware}"
# ROCKNIX/extra-firmware (SM8750/): the Odin 3 blobs upstream linux-firmware
# lacks (ath12k WCN7860 hw2.0, qcom/sm8750/ayn/odin3/ ADSP/CDSP, the audio
# topology + .jsn configs). Populated by `make sync` from the pinned commit in
# scripts/sync.sh; installed into /usr/lib/firmware for SM8750 only.
: "${FW_EXTRA_SRC_REL:=rocknix-extra-firmware/SM8750}"

# --- device packages (built from devices/sm8750/packages/, installed by build-image)
: "${DEVICE_BSP_PKG:=pocknix-bsp-sm8750}"
: "${DEVICE_META_PKG:=pocknix-device-sm8750}"
: "${KERNEL_PKG:=linux-pocknix-${SOC}}"
