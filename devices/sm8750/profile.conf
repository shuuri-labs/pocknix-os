# devices/sm8750/profile.conf — build-time profile of the SM8750 family image (AYN Odin 3).
# POSIX sh, sourced by scripts/lib.sh after config/pocknix.conf; the environment overrides it.

DEVICE_PRETTY="SM8750 family (AYN Odin 3)"
DEVICE_HOSTNAME="pocknix"     # substituted for @DEVICENAME@ in the kernel config (CONFIG_DEFAULT_HOSTNAME; runtime hostname is set by the image anyway)
: "${SOC:=sm8750}"            # selects kernel/${SOC}/

# --- qcom-abl boot contract (what the ROCKNIX-flashed ABL expects) -------------
# GPT p1: FAT32, partition-name SD_BOOT_PARTNAME, FAT label SD_FAT_LABEL,
# containing KERNEL + KERNEL.md5. GPT p2: ext4, partition-name ROOT_LABEL.
: "${BOOTLOADER:=qcom-abl}"
: "${SD_FAT_LABEL:=POCKNIX}"        # ours (the ABL scans FAT partitions for boot files, never the label)
: "${SD_BOOT_PARTNAME:=system}"     # GPT name of the FAT boot partition (ROCKNIX uses "system")
: "${ROOT_LABEL:=POCKNIX_ROOT}"

# --- kernel command line ------------------------------------------------------
# Plain ext4 root, NO initramfs (UFS/SCSI/ext4 built-in). One cmdline for the family (the
# boot image bakes it). video=efifb:off: the EFI framebuffer fights the DSI panel driver and
# leaves the screen black. mem_sleep_default=s2idle: deep wedges the SM8750.
: "${KERNEL_CMDLINE_ROOT:=root=PARTLABEL=${ROOT_LABEL} rw}"
: "${KERNEL_CMDLINE_EXTRA:=quiet loglevel=3 systemd.show_status=false splash logo.nologo plymouth.ignore-serial-consoles rootwait video=efifb:off console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat irqaffinity=0-1 cgroup.memory=nokmem,nosocket nosoftlockup mem_sleep_default=s2idle}"
: "${KERNEL_CMDLINE:=${KERNEL_CMDLINE_ROOT} ${KERNEL_CMDLINE_EXTRA}}"

# mangohud's GPU temperature: the hwmon name of the GPU thermal zone (the SoC dts names it).
: "${GPU_HWMON:=gpuss0_thermal}"

# --- device packages (built from devices/sm8750/packages/, installed by build-image)
: "${DEVICE_BSP_PKG:=pocknix-bsp-sm8750}"
: "${DEVICE_META_PKG:=pocknix-device-sm8750}"
: "${KERNEL_PKG:=linux-pocknix-${SOC}}"
