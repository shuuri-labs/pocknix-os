# Userspace compiler tuning for this chip. POSIX sh, sourced by scripts/lib.sh
# after the profile; build-packages.sh passes the values into makepkg's
# environment for the packages/soc and packages/gpu PKGBUILDs (never packages/shared).
: "${POCKNIX_TUNE_CFLAGS:=-march=armv9-a+fp16+crypto+i8mm+bf16+memtag+sm4+sha3+nosve+nosve2 -mtune=cortex-x4 -mno-outline-atomics}"

# FEX engine tuning: cortex-a78, not the armv9 prime. The JIT output is
# runtime-tuned to the real CPU regardless, so tuning the engine to the prime
# buys nothing and risks armv9 host-tool SIGILLs.
: "${POCKNIX_FEX_TUNE_CPU:=cortex-a78}"
