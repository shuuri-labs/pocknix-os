# /usr/lib/pocknix/boards/odin3.conf — runtime board facts: AYN Odin 3.
# Selected by /usr/lib/pocknix/device.conf (DT model "AYN Odin 3").
POCKNIX_DEVICE=odin3
POCKNIX_SOC=sm8750

# Panel: chipone,icna3520, native 1080x1920@120 portrait, DTS rotation=90 -> landscape.
# W/H are the NATIVE portrait geometry; pocknix-steam transposes them for 90/270.
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=120
POCKNIX_PANEL_ORIENT=right       # gamescope --force-orientation
POCKNIX_PANEL_MM=177x100         # deliberately fake: same 1920x1080 output as the RP6 -> same ~275dpi UI
POCKNIX_DESKTOP_ROTATE=right     # kscreen-doctor rotation token (Rotate270)
POCKNIX_DESKTOP_SCALE=2.5

# cpu0-5 mids, cpu6-7 primes; cpu0-1 are left out as the small cores.
POCKNIX_BIG_CORES=2-7

# --- install-to-internal contract (qcom-abl) -----------------------------------
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=POCKNIX
POCKNIX_BOOT_FAT_LABEL=POCKNIX
POCKNIX_ROOT_LABEL=POCKNIX_ROOT
