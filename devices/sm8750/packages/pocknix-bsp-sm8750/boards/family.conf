# /usr/lib/pocknix/boards/family.conf: facts every SM8750 board shares, sourced first by
# each board file (a board may override).
POCKNIX_SOC=sm8750

# Fake on every board: gamepadui sets its dpi from it as W * 25.4 / 177.
POCKNIX_PANEL_MM=177x100

# Cores games and emulators are pinned to (read through pocknix-bsp-common's cores.sh):
# cpu0-5 mids, cpu6-7 primes; cpu0-1 are left out as the small cores.
POCKNIX_BIG_CORES=2-7

# --- install-to-internal contract (qcom-abl) -----------------------------------
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=POCKNIX
POCKNIX_BOOT_FAT_LABEL=POCKNIX
POCKNIX_ROOT_LABEL=POCKNIX_ROOT
