# /usr/lib/pocknix/device.conf — SM8750 family runtime board DISPATCHER. POSIX sh, SOURCED
# by consumers at launch (then /etc/pocknix/device.conf as the admin override), so it must
# stay side-effect free. Unknown/absent model (includes the image-build chroot, which has no
# /proc/device-tree) falls back to odin3 and logs the model a new board entry needs.
_pocknix_model="$(cat /proc/device-tree/model 2>/dev/null | tr -d '\0')"
case "${_pocknix_model}" in
  "AYN Odin 3")
    . /usr/lib/pocknix/boards/odin3.conf
    ;;
  *)
    # Board not in the list: consumers must not force guessed values (see pocknix-desktop-rotate).
    POCKNIX_BOARD_UNKNOWN=1
    . /usr/lib/pocknix/boards/odin3.conf
    [ -n "${_pocknix_model}" ] && \
      logger -t pocknix "device.conf: unknown DT model '${_pocknix_model}' — using odin3 board defaults" 2>/dev/null || true
    ;;
esac
unset _pocknix_model