# Compressed-RAM swap (zram-generator): headroom for big games + Waydroid + in-game Steam
# downloads without touching flash. zstd compresses ~2-3x, so a `ram`-sized zram is a large
# elastic swap. The paired vm.swappiness lives in 60-pocknix-latency.conf.
[zram0]
# = total RAM on every board; only compressed dirty pages actually occupy RAM.
zram-size = ram
compression-algorithm = zstd
# Highest priority: zram is the only swap that should ever take pages.
swap-priority = 100
# Formatted as a swap device (mkswap), not as a zram-backed filesystem.
fs-type = swap
