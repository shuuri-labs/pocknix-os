# Factory power profiles for pocknix-perfd. Override per key in /etc/pocknix/power-profiles.conf;
# profile ids are what Steam stores per game, so never rename one.
# Ratios are fractions of the top OPP: gpu_min rounds up to an OPP, gpu_max and cpu_max down.
# cpu_max only applies where the SoC has no [underclock.<SOC>.<level>] table.

[general]
default_profile = balanced
gpu_manual_min = 0.45

[profile.eco]
label = Eco
fan = quiet
lavd = autopilot
underclock = large
cpu_max = 0.70
gpu_min = 0.0
gpu_max = 0.75

[profile.balanced]
label = Balanced
fan = quiet
lavd = autopilot
underclock = none
cpu_max = 1.0
gpu_min = 0.0
gpu_max = 1.0

[profile.performance]
label = Performance
fan = performance
lavd = performance
underclock = none
cpu_max = 1.0
gpu_min = 0.0
gpu_max = 1.0

# simple_ondemand hunts down under FEX on the A650 (#52); a 700 MHz floor holds frame pacing.
[profile.performance.SM8250]
gpu_min = 0.75

[underclock.SM8550.small]
policy0 = 1785600
policy3 = 2323200
policy7 = 2476800

[underclock.SM8550.medium]
policy0 = 1555200
policy3 = 2054400
policy7 = 2092800

[underclock.SM8550.large]
policy0 = 1459200
policy3 = 1785600
policy7 = 1843200

[underclock.SM8250.small]
policy0 = 1612800
policy4 = 2054400
policy7 = 2361600

[underclock.SM8250.medium]
policy0 = 1420800
policy4 = 1766400
policy7 = 1977600

[underclock.SM8250.large]
policy0 = 1344000
policy4 = 1574400
policy7 = 1747200
