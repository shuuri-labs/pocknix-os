# The RP6 delivers the WAKING KEY_POWER to userspace after resume, and logind has no resume
# holdoff: systemd's default (poweroff) shut the device down on a wake press, and
# HandlePowerKey=suspend would re-suspend on one. Short-press suspend is pocknix-powerd's job,
# which debounces after resume. Long-press poweroff is unaffected.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
