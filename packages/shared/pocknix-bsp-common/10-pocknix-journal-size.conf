# Bound the journal, the largest single writer to the flash.
# /var/log/journal exists, so journald is persistent and would otherwise cap itself at 10% of the
# filesystem (up to 4 GB). Kept persistent: pocknix-diag and bug reports need logs past a reboot.
[Journal]
SystemMaxUse=64M
RuntimeMaxUse=16M
# Size alone lets old entries sit on the card indefinitely.
MaxRetentionSec=1week
