# pocknix gaming/compositor responsiveness tuning.
# Targets the gamescope-SESSION symptoms that desktop/kwin mode does NOT exhibit: in-game
# choppiness and system-wide unresponsiveness under load (esp. in-game Steam downloads).

# RT throttle off: under a download saturating every core the 95% RT cap throttles the RR GPU,
# display and audio threads and frames stall. They sleep on vblank/irqs, so no runaway risk.
kernel.sched_rt_runtime_us=-1

# Cap dirty pages so a fast download flushes STEADILY instead of piling up to dirty_ratio (20% of
# RAM) and flushing in one system-stalling burst. 256 MiB / 64 MiB.
vm.dirty_bytes=268435456
vm.dirty_background_bytes=67108864
vm.page-cluster=0

# Smoother memory reclaim under pressure (less frame-pacing disruption from kswapd).
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125

# Watchdogs add per-CPU timer jitter; off for lower scheduling latency.
kernel.nmi_watchdog=0
kernel.soft_watchdog=0
kernel.watchdog=0

# Swap aggressively TO zram (compressed RAM, never disk): cold anon pages there cost less than
# evicting the game's file cache. >100 is valid on modern kernels.
vm.swappiness=180
