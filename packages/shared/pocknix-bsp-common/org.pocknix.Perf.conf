<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.pocknix.Perf"/>
    <allow send_destination="org.pocknix.Perf"/>
  </policy>
  <!-- steamos-manager's session daemon runs as the deck user, which is in wheel. -->
  <policy group="wheel">
    <allow send_destination="org.pocknix.Perf"/>
  </policy>
</busconfig>
