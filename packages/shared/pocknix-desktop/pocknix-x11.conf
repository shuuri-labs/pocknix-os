# kwin_wayland will not create /tmp/.X11-unix itself (gamescope does), and runs Wayland-only
# without it, leaving X11 apps unable to open a DISPLAY. Normally xorg-server ships this
# tmpfiles entry, but the minimal ALARM base has no xorg-server. 1777 = sticky, like /tmp.
d /tmp/.X11-unix 1777 root root -
