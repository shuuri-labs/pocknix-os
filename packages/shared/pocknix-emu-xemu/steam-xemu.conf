# exe + args are this tile's identity in Steam: never change them. An upgrade neither replaces nor
# removes the tile and a removal looks for the current values, so a new command needs a new file name.
name=xemu
exe=/usr/bin/pocknix-play
args=--gui xemu
description=Original Microsoft Xbox
category=Microsoft
icon=/opt/pocknix/emulators/xemu/icon.svg
