# plasmashell builds its quick-settings brightness widget once, at construction, and takes
# PowerDevil's D-Bus object then; the widget's only notification path watches the same name,
# so if it is not owned yet the slider's `visible` stays false for the whole session and nothing
# re-evaluates it. On this hardware PowerDevil needs several seconds to own the name (DDC probing
# plus the internal panels) while the shell starts around 4 s in, so the shell loses the race.
#
# plasma-powerdevil.service is Type=dbus / BusName=org.kde.Solid.PowerManagement, so systemd
# counts it as started only once the name is owned. Ordering the shell after it closes the race
# by construction.
#
# Do NOT add Wants=: that pulls PowerDevil in at graphical-session-pre, before kwin_wayland
# exists, where it aborts on the missing display and lands in start-limit-hit.
[Unit]
After=plasma-powerdevil.service
