# Matched by devicetree compatible (these boards have no DMI). The SoC entries last catch
# boards without their own line: an unmatched board would get a local CpuScaling1.

[[device]]
dt.compatible = "retroidpocket,rp6"
device        = "retroid_pocket_6"
variant       = "RP6"
friendly_name = "Retroid Pocket 6"

[[device]]
dt.compatible = "retroidpocket,rpnova"
device        = "retroid_pocket_nova"
variant       = "RPNova"
friendly_name = "Retroid Pocket Nova"

[[device]]
dt.compatible = "ayn,odin2"
device        = "ayn_odin_2"
variant       = "Odin2"
friendly_name = "AYN Odin 2"

[[device]]
dt.compatible = "ayn,odin2mini"
device        = "ayn_odin_2_mini"
variant       = "Odin2Mini"
friendly_name = "AYN Odin 2 Mini"

[[device]]
dt.compatible = "ayn,odin2portal"
device        = "ayn_odin_2_portal"
variant       = "Odin2Portal"
friendly_name = "AYN Odin 2 Portal"

[[device]]
dt.compatible = "ayn,thor"
device        = "ayn_thor"
variant       = "Thor"
friendly_name = "AYN Thor"

[[device]]
dt.compatible = "retroidpocket,rp5"
device        = "retroid_pocket_5"
variant       = "RP5"
friendly_name = "Retroid Pocket 5"

[[device]]
dt.compatible = "retroidpocket,rpflip2"
device        = "retroid_pocket_flip2"
variant       = "RPFlip2"
friendly_name = "Retroid Pocket Flip2"

[[device]]
dt.compatible = "qcom,sm8550"
device        = "pocknix_sm8550"
variant       = "SM8550"
friendly_name = "Snapdragon 8 Gen 2 handheld"

[[device]]
dt.compatible = "qcom,sm8250"
device        = "pocknix_sm8250"
variant       = "SM8250"
friendly_name = "Snapdragon 865 handheld"

# Leaves the slot for pocknix-perfd, which only allows schedutil.
[cpu_scaling]
driver = "none"
