# pocknix grub.cfg — SM8250 family boot menu (arm-efi).
# SINGLE SOURCE OF TRUTH for the runtime kernel cmdline: build-packages.sh dies if the first
# "linux /KERNEL ..." line drifts from devices/sm8250/profile.conf's KERNEL_CMDLINE, and every
# entry must carry that identical cmdline.
# Default is rp5; a Flip 2 first-boots on the rp5 dtb (same DTS bar the lid sensor), then
# pocknix-sm8250-board-select writes saved_entry into grubenv for the next boot. ROCKNIX's
# in-GRUB autodetect is unusable here: it needs a rawsearch patch postdating our bootaa64.efi.
insmod part_gpt
load_env
set default='rp5'
if [ -n "${saved_entry}" ]; then
  set default="${saved_entry}"
fi
set timeout=0

# root= is the FIXED pocknix SD PARTUUID (SD_ROOT_PARTUUID, stamped by build-sd-image.sh):
# an internal install carries the same POCKNIX_ROOT label, so label-based resolution races
# when both are present. pocknix-update-grub re-pins root= on every /flash refresh.
menuentry 'pocknix (Retroid Pocket 5)' --id 'rp5' {
        search --set -f /KERNEL
        linux /KERNEL root=PARTUUID=706f636b-6e69-7830-726f-6f7400000002 rw quiet loglevel=3 systemd.show_status=false splash plymouth.ignore-serial-consoles rootwait console=tty0 video=efifb:off gpt
        devicetree /boot/grub/sm8250-retroidpocket-rp5.dtb
}

menuentry 'pocknix (Retroid Pocket Flip 2)' --id 'rpflip2' {
        search --set -f /KERNEL
        linux /KERNEL root=PARTUUID=706f636b-6e69-7830-726f-6f7400000002 rw quiet loglevel=3 systemd.show_status=false splash plymouth.ignore-serial-consoles rootwait console=tty0 video=efifb:off gpt
        devicetree /boot/grub/sm8250-retroidpocket-flip2.dtb
}
