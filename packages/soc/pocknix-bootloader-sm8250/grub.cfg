# The runtime cmdline lives here: build-packages.sh dies if the first "linux /KERNEL" line drifts
# from devices/sm8250/profile.conf, and every entry must carry the same cmdline.
# A Flip 2 first-boots the rp5 dtb, then pocknix-sm8250-board-select sets saved_entry. ROCKNIX's
# in-GRUB autodetect needs a rawsearch patch newer than our bootaa64.efi.
# The Visionox panel is undetectable this early: a PC-created "visionox" file here picks its dtbs.
insmod part_gpt
load_env
set default='rp5'
if [ -n "${saved_entry}" ]; then
  set default="${saved_entry}"
fi
set panel=''
if [ -f /visionox ]; then set panel='visionox'; fi
if [ -f /visionox.txt ]; then set panel='visionox'; fi
if [ "${panel}" = "visionox" ]; then
  if [ "${default}" = "rp5" ]; then set default='rp5-visionox'; fi
  if [ "${default}" = "rpflip2" ]; then set default='rpflip2-visionox'; fi
fi
set timeout=0

# root= is a fixed PARTUUID: an internal install carries the same label, so label lookup races.
# pocknix-update-grub re-pins it on every /flash refresh.
menuentry 'pocknix (Retroid Pocket 5)' --id 'rp5' {
        search --set -f /KERNEL
        linux /KERNEL root=PARTUUID=706f636b-6e69-7830-726f-6f7400000002 rw quiet loglevel=3 systemd.show_status=false splash logo.nologo plymouth.ignore-serial-consoles rootwait console=tty0 video=efifb:off gpt
        devicetree /boot/grub/sm8250-retroidpocket-rp5.dtb
}

menuentry 'pocknix (Retroid Pocket Flip 2)' --id 'rpflip2' {
        search --set -f /KERNEL
        linux /KERNEL root=PARTUUID=706f636b-6e69-7830-726f-6f7400000002 rw quiet loglevel=3 systemd.show_status=false splash logo.nologo plymouth.ignore-serial-consoles rootwait console=tty0 video=efifb:off gpt
        devicetree /boot/grub/sm8250-retroidpocket-flip2.dtb
}

menuentry 'pocknix (Retroid Pocket 5, Visionox panel)' --id 'rp5-visionox' {
        search --set -f /KERNEL
        linux /KERNEL root=PARTUUID=706f636b-6e69-7830-726f-6f7400000002 rw quiet loglevel=3 systemd.show_status=false splash logo.nologo plymouth.ignore-serial-consoles rootwait console=tty0 video=efifb:off gpt
        devicetree /boot/grub/sm8250-retroidpocket-rp5-visionox.dtb
}

menuentry 'pocknix (Retroid Pocket Flip 2, Visionox panel)' --id 'rpflip2-visionox' {
        search --set -f /KERNEL
        linux /KERNEL root=PARTUUID=706f636b-6e69-7830-726f-6f7400000002 rw quiet loglevel=3 systemd.show_status=false splash logo.nologo plymouth.ignore-serial-consoles rootwait console=tty0 video=efifb:off gpt
        devicetree /boot/grub/sm8250-retroidpocket-flip2-visionox.dtb
}
