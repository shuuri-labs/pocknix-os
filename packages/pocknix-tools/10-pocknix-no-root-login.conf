# Every image ships the same public root password, so root over SSH is off by default,
# independent of the Pocknix Tools toggle (which only starts/stops sshd). This wins over
# PermitRootLogin in sshd_config: that file includes this directory on its second line and
# sshd takes the first value it obtains. Edit here to allow it; pacman keeps your version.
PermitRootLogin no
