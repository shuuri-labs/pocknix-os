# kernel/sm8750/kernel.conf — per-SoC kernel source pins + package release. POSIX sh, sourced by
# scripts/lib.sh after the device profile (which sets SOC and thereby selects
# this file). Bumping this SoC's kernel never touches another SoC's tree.
#
# Stock kernel.org source, pinned. The full kernel is this stock source + the
# patch stack under kernel/sm8750/patches/ (applied in numeric subdir order:
# 10-mainline -> 20-version -> 30-sm8750, then kernel/common/patches) + the config.
#
# `make sync` moves the patch stack, never this pin: bump it by hand when
# ROCKNIX's packages/linux/package.mk moves.
: "${KERNEL_VERSION:=7.2.10}"
: "${KERNEL_SOURCE_URL:=https://www.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz}"
: "${KERNEL_SOURCE_SHA256:=2feaa70453e91f541be6a5c9078d8168e081af45a3d9718054850538cff2ebf3}"

# The kernel package's pkgrel (packages/soc/linux-pocknix reads it with KERNEL_VERSION as
# pkgver): bump it to repackage the same kernel, back to 1 when KERNEL_VERSION moves.
: "${KERNEL_PKGREL:=2}"

# ROCKNIX's version patch dir (packages/linux/patches/<ver>/). Not derived from
# KERNEL_VERSION: ROCKNIX's dir name can lag the kernel version it patches.
: "${ROCKNIX_VERSION_PATCH_DIR:=7.2}"

# The ROCKNIX device dir this tree is synced from (scripts/sync.sh):
# ${ROCKNIX_PROJECT_DIR}/devices/${ROCKNIX_SOC}. ROCKNIX names its device dirs
# in uppercase; our SOC key is lowercase (it names kernel/<soc>/ and
# vendor/rocknix-<soc>/).
: "${ROCKNIX_SOC:=SM8750}"
