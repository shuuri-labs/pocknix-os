# kernel/sm8750/kernel.conf — per-SoC kernel source pins. POSIX sh, sourced by
# scripts/lib.sh after the device profile (which sets SOC and thereby selects
# this file). Bumping this SoC's kernel never touches another SoC's tree.
#
# Stock kernel.org source, pinned. The full kernel is this stock source + the
# patch stack under kernel/sm8750/patches/ (applied in numeric subdir order:
# 10-mainline -> 20-sm8750 -> 30-version) + the config.
#
# ROCKNIX uses kernel 7.2 for SM8750 (packages/linux/package.mk).
: "${KERNEL_VERSION:=7.2}"
: "${KERNEL_SOURCE_URL:=https://www.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz}"
: "${KERNEL_SOURCE_SHA256:=}"

# ROCKNIX's version-specific patch dir for SM8750 is "7.2" (matches PKG_VERSION in
# packages/linux/package.mk; the dir name is ${KERNEL_VERSION%.*} by default).
: "${ROCKNIX_VERSION_PATCH_DIR:=7.2}"

# The ROCKNIX device dir this tree is synced from (scripts/sync.sh):
# ${ROCKNIX_PROJECT_DIR}/devices/${ROCKNIX_SOC}. ROCKNIX names its device dirs
# in uppercase; our SOC key is lowercase (it names kernel/<soc>/ and
# vendor/rocknix-<soc>/).
: "${ROCKNIX_SOC:=SM8750}"
