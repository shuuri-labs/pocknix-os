# CI: lint and the PR rules on every push/PR, a kernel patch apply check when the series moves,
# an unsigned build of each package a PR changes, and a manual full userspace build. Nothing is
# signed or published here: the GPG key stays on the build VM. Kernel builds: kernel-build.yml.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Build every userspace package for every SoC (aarch64, hours; no kernel, no image)"
        type: boolean
        default: false

permissions:
  contents: read

# bash -eo pipefail, so a failing command on the left of a pipe fails the step
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shell syntax (bash -n) for every script + PKGBUILD
        run: |
          set -e
          for f in scripts/*.sh; do bash -n "$f"; done
          find packages devices -name PKGBUILD -print0 | xargs -0 -n1 bash -n
          echo "syntax OK"
      - name: shellcheck (informational)
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning scripts/*.sh || true
      - name: make check (every SoC family, perfd profiles, package placement)
        run: bash scripts/check.sh
      - name: PR rules (patch files, pkgrel, commit subjects, description)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # the live base tip, not base.sha (main as of the PR's last push)
        run: bash scripts/check-pr.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  changes:
    runs-on: ubuntu-latest
    outputs:
      kernel_apply: ${{ steps.diff.outputs.kernel_apply }}
      kernel_build: ${{ steps.diff.outputs.kernel_build }}
      builds: ${{ steps.diff.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "${EVENT}" in
            pull_request) base="${PR_BASE}" head="${PR_HEAD}" ;;
            # a new branch's first push has an all-zero before
            push) base="${PUSH_BEFORE}" head="${GITHUB_SHA}"
                  git cat-file -e "${base}^{commit}" 2>/dev/null || base="${GITHUB_SHA}~1" ;;
            *) base="${GITHUB_SHA}" head="${GITHUB_SHA}" ;;
          esac
          bash scripts/ci.sh changes "${base}" "${head}" | tee -a "${GITHUB_OUTPUT}"

  kernel-patches:
    needs: changes
    if: ${{ needs.changes.outputs.kernel_apply != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(needs.changes.outputs.kernel_apply) }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          v="$(. "kernel/${{ matrix.soc }}/kernel.conf" && echo "${KERNEL_VERSION}")"
          echo "kernel=${v}" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@v4
        with:
          path: build/cache/linux-${{ steps.ver.outputs.kernel }}.tar.xz
          key: kernel-src-${{ steps.ver.outputs.kernel }}
      - name: Apply the ${{ matrix.soc }} kernel patch series (no compile)
        run: bash scripts/check-kernel-apply.sh ${{ matrix.soc }}

  pr-build:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.builds != '[]' }}
    name: pr-build (${{ matrix.repo }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.builds) }}
    env:
      PKGS: ${{ matrix.pkgs }}
      ARTIFACT: pr-${{ github.event.pull_request.number }}-${{ matrix.repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-host
        with:
          soc: ${{ matrix.soc }}
      - name: Seed the live siblings these packages build against
        run: |
          read -ra pkgs <<<"${PKGS}"
          bash scripts/ci.sh seed ${{ matrix.soc }} "${pkgs[@]}"
      - name: Scratch pkgrel below the next release
        run: |
          read -ra pkgs <<<"${PKGS}"
          bash scripts/ci.sh scratch "origin/${{ github.base_ref }}" "${{ github.run_number }}" "${pkgs[@]}"
      - name: Build ${{ matrix.pkgs }}
        run: sudo env POCKNIX_CCACHE_SIZE=3G make packages DEVICE=${{ matrix.soc }} PKG="${PKGS}"
      - name: Collect this run's packages
        run: |
          read -ra pkgs <<<"${PKGS}"
          bash scripts/ci.sh collect ${{ matrix.soc }} "${{ github.run_number }}" ci-out "${pkgs[@]}"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ci-out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: How to install
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### [${ARTIFACT}](${URL})"
            echo "Unsigned test build of this PR (pkgrel below the next release). On the build host:"
            echo '```bash'
            echo "gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n ${ARTIFACT} -D ${ARTIFACT}"
            echo "scp ${ARTIFACT}/*.pkg.tar.* root@<device>:/tmp/ && ssh root@<device> 'pacman -U /tmp/*.pkg.tar.*'"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: build/ccache
          key: ccache-${{ matrix.soc }}-${{ github.run_id }}

  # The one check to require: the matrix and path-gated jobs only exist when a PR needs them.
  ci:
    if: ${{ always() }}
    needs: [lint, changes, kernel-patches, pr-build]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed (skipped ones count)
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]

  full-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # shared packages build once, in the default DEVICE's run
        include:
          - soc: sm8550
            shared: --shared
          - soc: sm8250
            shared: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-host
        with:
          soc: ${{ matrix.soc }}
      - run: df -h / && nproc && free -g
      - name: Build packages
        run: |
          pkgs="$(bash scripts/ci.sh soc-pkgs ${{ matrix.soc }} ${{ matrix.shared }})"
          echo "PKGS=${pkgs}" >> "${GITHUB_ENV}"
          sudo env POCKNIX_CCACHE_SIZE=3G make packages DEVICE=${{ matrix.soc }} PKG="${pkgs}"
      - name: Every package built
        if: ${{ !cancelled() && env.PKGS != '' }}
        run: |
          read -ra pkgs <<<"${PKGS}"
          bash scripts/ci.sh verify ${{ matrix.soc }} "${pkgs[@]}"
      - name: Package sizes
        if: ${{ !cancelled() }}
        run: ls -l build/localrepo/*/*.pkg.tar.* && df -h /
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: build/ccache
          key: ccache-${{ matrix.soc }}-${{ github.run_id }}
