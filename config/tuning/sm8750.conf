# config/tuning/sm8750.conf — per-SoC userspace compiler tuning. POSIX sh,
# sourced by scripts/lib.sh right after kernel/${SOC}/kernel.conf; consumed by
# build-packages.sh, which passes the values into makepkg's environment for the
# tuned PKGBUILDs (mesa, gamescope, mangohud, fex-emu).
#
# ROCKNIX's exact SM8750 userspace flags (devices/SM8750/options:
# TARGET_CPU=cortex-x4, TARGET_CPU_FLAGS=+fp16+crypto+i8mm+bf16+memtag+sm4+sha3
# +nosve+nosve2, composed by config/arch.aarch64 into -march/-mtune).
: "${POCKNIX_TUNE_CFLAGS:=-march=armv9-a+fp16+crypto+i8mm+bf16+memtag+sm4+sha3+nosve+nosve2 -mtune=cortex-x4 -mno-outline-atomics}"

# FEX engine tuning. Like the sm8550 case, ROCKNIX remaps the SM8750 TARGET_CPU
# (cortex-x4) DOWN to cortex-a78 for the FEX build: the JIT output is
# runtime-tuned to the real CPU regardless, so tuning the engine to armv9
# prime buys nothing and risks armv9 host-tool SIGILLs.
: "${POCKNIX_FEX_TUNE_CPU:=cortex-a78}"
