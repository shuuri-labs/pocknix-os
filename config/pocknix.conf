# pocknix-os build configuration
#
# Central settings sourced by every script in scripts/. Override any value by
# exporting it in your shell before invoking make, e.g.:
#
#   export DISTRIBUTION_DIR=/path/to/distribution
#   make build
#
# This file must stay POSIX-sh compatible (it is sourced, not executed).

# ---------------------------------------------------------------------------
# Image target — a key into devices/<name>/profile.conf, which lib.sh sources
# right after this file. What differs per family (SoC, boot style, kernel cmdline)
# lives in the profile; this file holds target-NEUTRAL settings, including the
# profile defaults below that every family shares.
#   make build DEVICE=sm8550   (or export DEVICE before invoking make)
# DEVICE names an IMAGE TARGET — one FAMILY target per SoC (sm8550, sm8250):
# each family image serves every board on its SoC, with the board selected at
# runtime by devicetree model (the BSP's boards/ + the device.conf rendered from boards/models).
# ---------------------------------------------------------------------------
: "${DEVICE:=sm8550}"         # a SoC family, not a board (members: the BSP's boards/)

# Profile defaults every family shares (the ordering rule is in scripts/lib.sh).
: "${DEVICE_HOSTNAME:=pocknix}"     # kernel CONFIG_DEFAULT_HOSTNAME only; the image sets the real one
# qcom-abl's ABL scans FAT partitions for boot files, never the label; on arm-efi a ROCKNIX
# label would hijack ROCKNIX boots.
: "${SD_FAT_LABEL:=POCKNIX}"
: "${SD_BOOT_PARTNAME:=system}"     # GPT name of the SD boot FAT
: "${ROOT_LABEL:=POCKNIX_ROOT}"     # GPT name and btrfs label of the root partition

# --- Layout ----------------------------------------------------------------
# Absolute paths under POCKNIX_ROOT (set by lib.sh); KERNEL_DIR is derived there once SOC is set.
: "${BUILD_DIR:=${POCKNIX_ROOT}/build}"
: "${ROOTFS_DIR:=${BUILD_DIR}/rootfs}"
# NB: IMAGE_DIR and KERNEL_BUILD_DIR are derived in lib.sh as build/image/${SOC}
# and build/kernel/${SOC} once the profile has set the SoC (like KERNEL_DIR).
: "${VENDOR_DIR:=${POCKNIX_ROOT}/vendor}"
: "${CONFIG_DIR:=${POCKNIX_ROOT}/config}"
: "${PACKAGES_DIR:=${POCKNIX_ROOT}/packages}"
: "${CACHE_DIR:=${BUILD_DIR}/cache}"

# --- Arch Linux ARM base rootfs --------------------------------------------
# Pin POCKNIX_ALARM_SHA256 for a reproducible build; empty skips verification with a warning.
: "${ALARM_MIRROR:=http://os.archlinuxarm.org/os}"
: "${ALARM_TARBALL:=ArchLinuxARM-aarch64-20261023.tar.gz}"
: "${POCKNIX_ALARM_SHA256:=3cf5764fb6fec7bffdff98787e52ccd15d5d6390a2496c7028d7c4950404c56a}"
# Overridable apart from the mirror: make snapshot repoints it at our R2 copy, so an old release
# still rebuilds once ALARM stops serving the file.
: "${POCKNIX_ALARM_TARBALL_URL:=https://pocknix.shuuri.net/repo/base/ArchLinuxARM-aarch64-20261023.tar.gz}"

# --- Kernel ----------------------------------------------------------------
# Source pins live in kernel/<soc>/kernel.conf, the cmdline in devices/<name>/profile.conf.

# mkbootimg (Google): builds the qcom-abl Android boot image.
: "${MKBOOTIMG_URL:=https://android.googlesource.com/platform/system/tools/mkbootimg}"
: "${MKBOOTIMG_COMMIT:=d2bb0af5ba6d3198a3e99529c97eda1be0b5a093}"

# Parallelism for the kernel compile
: "${JOBS:=}"

# --- SD boot-test image (build-sd-image.sh) --------------------------------
# Fixed PARTUUIDs (hex spells pocknix0boot/root): an internal install shares the SD's labels, so
# label-based root= races. dd the image onto two media in one device and they collide.
: "${SD_BOOT_PARTUUID:=706f636b-6e69-7830-626f-6f7400000001}"
: "${SD_ROOT_PARTUUID:=706f636b-6e69-7830-726f-6f7400000002}"
: "${SD_BOOT_MIB:=256}"             # size of the FAT boot partition
: "${SD_SLACK_MIB:=1024}"           # free space added to the root partition beyond the rootfs
: "${SD_ROOT_PASSWORD:=pocknix}"    # root password baked into the test image (CHANGE for real use)
# SSH server, OFF by default (the password above is public — see build-sd-image.sh).
# For a dev image reachable from first boot:  sudo SD_SSH=on make sd-image
: "${SD_SSH:=off}"
# Optional Wi-Fi pre-seed so the image joins on boot (pair with SD_SSH=on), e.g.
#   sudo SD_WIFI_SSID='MyNet' SD_WIFI_PSK='secret' make sd-image
: "${SD_WIFI_SSID:=}"
: "${SD_WIFI_PSK:=}"
# Wi-Fi regulatory country (ISO code, e.g. GB). Needed for 5 GHz: unset, the kernel stays on the
# world domain, where 5 GHz channels are no-IR and association fails.
: "${SD_WIFI_COUNTRY:=}"

# --- Published repos -------------------------------------------------------
# POCKNIX_REPO_URL unset: no stanza, reflash-only. Devices fetch <url>/<soc>: tuned packages
# share pkgnames across SoCs with different binaries.
: "${POCKNIX_REPO_URL:=https://pocknix.shuuri.net/repo}"
# "Optional TrustAll" for unsigned LAN testing
: "${POCKNIX_REPO_SIGLEVEL:=Required DatabaseOptional}"
# publish-repo.sh signs with this key; empty = unsigned
: "${POCKNIX_REPO_GPG_KEY:=Pocknix Packaging}"
# public half of the signing key, COMMITTED (config/pocknix-repo.gpg) so image
# builds are host-independent (a ${HOME} default breaks under sudo: HOME=/root)
: "${POCKNIX_REPO_PUBKEY:=${POCKNIX_ROOT}/config/pocknix-repo.gpg}"
: "${POCKNIX_REPO_RCLONE_REMOTE:=r2:pocknix/repo}"
# SD-image publishing (make publish-image): destination + public base URL for
# the printed download link, e.g. r2:pocknix/images + https://dl.<domain>/images
: "${POCKNIX_IMAGE_RCLONE_REMOTE:=r2:pocknix/images}"
: "${POCKNIX_IMAGE_URL:=https://pocknix.shuuri.net/images}"

# --- Frozen ALARM package base ([pocknix-base]) ----------------------------
# The label (make snapshot) versions pocknix-base-lock and pins rootfs + chroot to [pocknix-base];
# empty = live ALARM. The URL never changes, so a new base reaches devices by plain -Syu.
: "${POCKNIX_BASE_SNAPSHOT:=20261023.1}"
: "${POCKNIX_BASE_URL:=${POCKNIX_REPO_URL}/base}"
# Where make snapshot publishes the base, and the ALARM mirror it harvests (sha256-checked against
# the build's sync dbs, so any mirror is safe; an unpinned build installs from it too).
: "${POCKNIX_BASE_RCLONE_REMOTE:=${POCKNIX_REPO_RCLONE_REMOTE}/base}"
: "${POCKNIX_ALARM_PKG_MIRROR:=http://mirror.archlinuxarm.org/aarch64}"

# --- Compiler cache --------------------------------------------------------
# build/ccache for the package chroots; 0 = off. A new base's compiler invalidates it on its own;
# a package opts out with `export CCACHE_DISABLE=1` in its build().
: "${POCKNIX_CCACHE:=1}"
: "${POCKNIX_CCACHE_SIZE:=20G}"

# --- make sync source ------------------------------------------------------
# ROCKNIX_DEVICE_DIR is derived in lib.sh from kernel.conf's ROCKNIX_SOC.
: "${DISTRIBUTION_DIR:=${POCKNIX_ROOT}/../distribution}"
: "${ROCKNIX_PROJECT_DIR:=${DISTRIBUTION_DIR}/projects/ROCKNIX}"

# --- Cross-build / chroot helpers ------------------------------------------
# On an x86_64 host the aarch64 pacman runs under qemu-user-static via binfmt_misc.
: "${QEMU_AARCH64_STATIC:=/usr/bin/qemu-aarch64-static}"
